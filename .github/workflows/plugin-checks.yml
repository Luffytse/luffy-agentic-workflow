name: Plugin checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  plugin-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # full history and every branch, so origin/main exists for the version bump check
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Run the plugin check script
        run: scripts/check-plugin.sh
      - name: Validate plugins and marketplace
        run: claude plugin validate .
